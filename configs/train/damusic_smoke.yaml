# DA-MUSIC smoke test: K=2 subset of the 50k subnet_genk demo corpus
# (~12.5k train / ~1.3k val scenes, T=512).  Same adapter/schedule as
# damusic_paper_k2.yaml; run with `--epochs 2` to check the pipeline end-to-end.
model:
  name: damusic
  adapter_class: reconunet.models.third_party.damusic_adapter.DAMUSICAdapter
  init: {N: 8, T: 512, M: 2, hermitian_psd: true, psd_eps: 1.0e-6}

collate: damusic

data:
  config: configs/data/subnet_genk.yaml
  k_filter: [2]
  batch_size: 512
  num_workers: 4
  pin_memory: true

optim:
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0
  scheduler: {name: reduce_on_plateau, mode: min, factor: 0.7, patience: 5, min_lr: 1.0e-6}

loss:
  rmspel_weight: 1.0

train:
  epochs: 2
  val_every_epoch: 1
  checkpoint_dir: experiments/runs/damusic_smoke/checkpoints/
  tensorboard_dir: experiments/runs/damusic_smoke/tb/
  early_stopping_patience: 25
  amp: false

eval:
  config: configs/eval/evaluation_config.yaml

seed: 20260420
