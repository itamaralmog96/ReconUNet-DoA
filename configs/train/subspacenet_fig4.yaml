# --------------------------------------------------------------------------
# SubspaceNet — paper Fig. 4 reproduction training (M=2, non-coherent, T=200).
# --------------------------------------------------------------------------
# Recipe follows Shmuel et al. 2023 §IV-A-2/A-3 as closely as our pipeline
# allows: SubspaceNet (tau=8) + Root-MUSIC head, Adam LR 1e-3, trained on the
# lowest-SNR (-5 dB) data; evaluated later across the [-5,0] dB sweep.

model:
  name: subspacenet
  adapter_class: reconunet.models.third_party.subspacenet_adapter.SubspaceNetAdapter
  init:
    M: 2                              # Fig 4 uses M=2 sources
    tau: 8
    diff_method: root_music

collate: subspacenet

data:
  config: configs/data/fig4_repro.yaml   # train/val at fixed SNR=-5 dB
  batch_size: 512
  num_workers: 0
  pin_memory: false

optim:
  optimizer: adam
  lr: 1.0e-3                          # paper §IV-A-2 (μ = 0.001)
  weight_decay: 1.0e-9                # paper §IV (upstream default)
  grad_clip_norm: 1.0
  scheduler:
    name: reduce_on_plateau
    mode: min
    factor: 0.5
    patience: 8
    min_lr: 1.0e-6

loss:
  rmspel_weight: 1.0

train:
  epochs: 80                          # paper §IV-A-3
  val_every_epoch: 1
  checkpoint_dir: experiments/runs/subspacenet_fig4/checkpoints/
  tensorboard_dir: experiments/runs/subspacenet_fig4/tb/
  early_stopping_patience: 20
  amp: false

seed: 20260420
