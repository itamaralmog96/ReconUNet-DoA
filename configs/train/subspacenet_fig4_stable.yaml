# --------------------------------------------------------------------------
# SubspaceNet — Fig. 4 reproduction, STABLE-LR variant.
# --------------------------------------------------------------------------
# The 1e-3 / 5e-4 runs converged fast but with a bouncy validation curve and
# a very early "best" epoch, then plateaued ~2.5-3° and at high SNR produced a
# surrogate R̂ WORSE than the raw covariance (over-denoising). That is the
# signature of under-converged training. This run uses the stable LR=1e-4
# (smooth in earlier smoke), mixed-SNR data, and a longer budget.

model:
  name: subspacenet
  adapter_class: reconunet.models.third_party.subspacenet_adapter.SubspaceNetAdapter
  init:
    M: 2
    tau: 8
    diff_method: root_music

collate: subspacenet

data:
  config: configs/data/fig4_mixed.yaml
  batch_size: 256
  num_workers: 0
  pin_memory: false

optim:
  optimizer: adam
  lr: 1.0e-4
  weight_decay: 1.0e-9
  grad_clip_norm: 1.0
  scheduler:
    name: reduce_on_plateau
    mode: min
    factor: 0.5
    patience: 10
    min_lr: 1.0e-6

loss:
  rmspel_weight: 1.0

train:
  epochs: 100
  val_every_epoch: 1
  checkpoint_dir: experiments/runs/subspacenet_fig4_stable/checkpoints/
  tensorboard_dir: experiments/runs/subspacenet_fig4_stable/tb/
  early_stopping_patience: 25
  amp: false

seed: 20260420
