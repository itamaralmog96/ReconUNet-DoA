# --------------------------------------------------------------------------
# SubViT (DOA-ViT, Zhou et al.) — paper-faithful baseline training.
# --------------------------------------------------------------------------
#
# Almog & Weiss 2026 §IV uses the same Adam schedule as for ReconUNet and
# SubspaceNet (LR 1e-4, wd 1e-5, batch 2048, ReduceLROnPlateau f=0.7 p=5,
# 300 epochs, early stop 25, grad clip 1.0).  This file replaces the legacy
# AdamW + cosine schedule from configs/train/subvit.yaml so the three
# baselines share an apples-to-apples training schedule.
#
# Companion to configs/train/reconunet_paper.yaml; see
# docs/PAPER_FAITHFUL_TRAINING.md for the full audit.
# --------------------------------------------------------------------------

model:
  name: subvit
  adapter_class: reconunet.models.third_party.subvit_adapter.SubViTAdapter
  init:
    M: 8
    K_max: 4                          # paper_corpus is k_choices=[1,2,3,4]
    grid_size: 121
    angle_range_deg: [-60.0, 60.0]
    # Zhou et al. §V-2 published hyperparameters: D=768 (d_k = 768/12 = 64),
    # 6 transformer encoders, 12 attention heads, MLP expansion 4 (upstream
    # default mlp_ratio=4.0).  An earlier run used a 9x smaller variant
    # (embed_dim 256 / 8 heads / 4.8M params) — NOT representative of the
    # published DOA-ViT capacity; results from it must not be labeled as
    # "the SubViT baseline".
    embed_dim: 768
    depth: 6
    num_heads: 12

collate: subvit

data:
  config: configs/data/paper_corpus.yaml
  # Paper §IV batch=2048 — measured to fit easily (peak ~1.9 GiB of 16 GiB; the
  # ViT is only 4.8M params on 8x8 inputs), so no accumulate-grad needed and the
  # three baselines share an identical batch size (apples-to-apples).
  batch_size: 2048
  num_workers: 8
  pin_memory: true

optim:
  optimizer: adam                     # paper §IV (legacy used adamw)
  lr: 1.0e-4                          # paper §IV (legacy used 3e-4)
  weight_decay: 1.0e-5                # paper §IV (legacy used 5e-2)
  grad_clip_norm: 1.0
  scheduler:
    name: reduce_on_plateau           # paper §IV (legacy used cosine)
    mode: min
    factor: 0.7
    patience: 5
    min_lr: 1.0e-6

loss:
  # Grid-BCE on the spatial spectrum is the TRAINING objective (the only key
  # the trainer consumes for this adapter).  At validation time the loss falls
  # through to sorted RMSPE (the spectrum carries no grad under no_grad), so
  # checkpoint selection / early stopping monitor an angle-domain criterion —
  # a deliberate choice now that peak-picking uses the true per-sample K.
  # (Former dead keys peak_sharpness / topk_rmspel_weight removed — they were
  # never consumed by the trainer.)
  bce_weight: 1.0

train:
  epochs: 300                         # paper §IV (legacy: 80)
  val_every_epoch: 1
  checkpoint_dir: experiments/runs/subvit_paper/checkpoints/
  tensorboard_dir: experiments/runs/subvit_paper/tb/
  early_stopping_patience: 25
  # The trainer force-disables AMP for all adapter/native models (complex
  # tensors); all three baselines train in full fp32 — a fairness plus.
  amp: false

eval:
  config: configs/eval/evaluation_config.yaml

seed: 20260420
