# --------------------------------------------------------------------------
# Generalised SubspaceNet — trained on ALL source counts (K in {1,2,3,4})
# with multipath, exactly like ReconUNet (apples-to-apples baseline).
# --------------------------------------------------------------------------
# The adapter estimates the TRUE per-sample number of sources (n_sources is
# threaded through the training loop), so one model covers all K. Same shared
# variable-K + multipath distribution as ReconUNet (configs/data/paper_corpus).

model:
  name: subspacenet
  adapter_class: reconunet.models.third_party.subspacenet_adapter.SubspaceNetAdapter
  init:
    M: 4                              # K_max; only a fallback — per-sample K is used
    tau: 8
    diff_method: root_music

collate: subspacenet

data:
  config: configs/data/subnet_genk.yaml
  batch_size: 512
  num_workers: 0
  pin_memory: false

optim:
  optimizer: adam
  lr: 1.0e-4
  weight_decay: 1.0e-9
  grad_clip_norm: 1.0
  scheduler:
    name: reduce_on_plateau
    mode: min
    factor: 0.5
    patience: 8
    min_lr: 1.0e-6

loss:
  rmspel_weight: 1.0

train:
  epochs: 80
  val_every_epoch: 1
  checkpoint_dir: experiments/runs/subspacenet_genk/checkpoints/
  tensorboard_dir: experiments/runs/subspacenet_genk/tb/
  early_stopping_patience: 20
  amp: false

seed: 20260420
