# Evaluate ReconUNet (paper checkpoint) on the paper test split.
manifest: data/scenes/paper/test.npy
output_dir: experiments/runs/eval_reconunet_paper/
batch_size: 128
seed: 20260420

snr_sweep_db: [-10, -5, 0, 5, 10, 15, 20]

models:
  - name: reconunet
    class_path: reconunet.models.deep_learning.EVDUNet.EVDCovarianceReconstructionUNet
    init:
      M: 8
      tau: 8
      activation_type: anti_rectifier
      use_dropout: true
    checkpoint: experiments/runs/reconunet_paper/checkpoints/best.pt
    collate: reconunet
