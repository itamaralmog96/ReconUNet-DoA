# --------------------------------------------------------------------------
# Fig. 4 reproduction — MIXED-SNR training corpus (SNR uniform over [-5, 0]).
# --------------------------------------------------------------------------
# Variant of fig4_repro.yaml that trains across the whole SNR sweep instead
# of only the lowest SNR.  A single-SNR-trained model overfits its noise
# level and does not improve at higher test SNR; training across the range
# yields the paper's monotonically-improving-with-SNR curves.

manifest:
  train_path: data/scenes/fig4_mixed/train.npy
  val_path:   data/scenes/fig4_mixed/val.npy
  test_path:  data/scenes/fig4_mixed/test.npy
  train_size: 40_000
  val_size:    4_000
  test_size:   1_000

meta:
  M: 8
  element_spacing_lambda: 0.5
  array_type: ULA
  T: 200
  fs_Hz: 2.45e9
  speed_of_light: 2.998e8
  tau: 8
  K_max: 8
  angle_range_deg: [-60.0, 60.0]
  snr_range_db:    [-5.0, 0.0]                # MIXED training SNR
  version: "0.1-fig4-mixed"
  notes: "SubspaceNet Fig.4 repro — mixed-SNR train, M=2 non-coherent, T=200, calibrated."

sampling:
  array_errors: none
  k_choices: [2]
  min_separation_deg: 5.0
  rng_seed: 20260422
