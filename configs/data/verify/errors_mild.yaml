# verify/errors_mild.yaml — the paper-default "mild" imperfection preset.
#   (gain 0.1 dB, phase 1°, coupling 0.02, position 1 %)
# Used as the centerline imperfection curve.
#
#   reconunet-generate -c configs/data/verify/errors_mild.yaml --overwrite
#   python scripts/verify/run_classic_on_manifest.py \
#       data/scenes/verify/errors_mild/test.npy \
#       --algo music --n 1000 --true-k --group-by snr_db

manifest:
  train_path: data/scenes/verify/errors_mild/train.npy
  val_path:   data/scenes/verify/errors_mild/val.npy
  test_path:  data/scenes/verify/errors_mild/test.npy
  train_size: 2000
  val_size:    500
  test_size:  3000

meta:
  M: 8
  element_spacing_lambda: 0.5
  array_type: ULA
  T: 512
  fs_Hz: 2.45e9
  speed_of_light: 2.998e8
  tau: 8
  K_max: 8
  angle_range_deg: [-60.0, 60.0]
  snr_range_db:    [-10.0, 20.0]
  version: "verify-errors-mild"
  notes: "Mild imperfections (paper default)"

sampling:
  array_errors: mild
  k_choices: [3]
  min_separation_deg: 3.0
  rng_seed: 20260431
