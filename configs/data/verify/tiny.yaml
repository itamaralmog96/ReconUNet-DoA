# --------------------------------------------------------------------------
# verify/tiny.yaml — a ~30 s smoke-test manifest.
# --------------------------------------------------------------------------
# Used by docs/VERIFY_AND_TEST.md §2 ("30-second sanity loop").
#
#   reconunet-generate -c configs/data/verify/tiny.yaml --overwrite
#   python scripts/verify/inspect_manifest.py data/scenes/verify/tiny/train.npy
#   python scripts/verify/visualize_scene.py  data/scenes/verify/tiny/train.npy \
#       --index 0 --out experiments/verify/scene_0.png
#   python scripts/verify/run_classic_on_manifest.py \
#       data/scenes/verify/tiny/val.npy --algo music --n 100 --true-k

manifest:
  train_path: data/scenes/verify/tiny/train.npy
  val_path:   data/scenes/verify/tiny/val.npy
  test_path:  data/scenes/verify/tiny/test.npy
  train_size: 1000
  val_size:    200
  test_size:   200

meta:
  M: 8
  element_spacing_lambda: 0.5
  array_type: ULA
  T: 512
  fs_Hz: 2.45e9
  speed_of_light: 2.998e8
  tau: 8
  K_max: 8
  angle_range_deg: [-60.0, 60.0]
  snr_range_db:    [-10.0, 20.0]
  version: "verify-tiny"
  notes: "verification smoke-test corpus"

sampling:
  array_errors: mild
  k_choices: [3]
  min_separation_deg: 3.0
  rng_seed: 20260420
