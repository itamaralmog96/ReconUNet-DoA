# --------------------------------------------------------------------------
# Generalised SubspaceNet training corpus — variable K + multipath.
# --------------------------------------------------------------------------
# Same DISTRIBUTION as configs/data/paper_corpus.yaml (the corpus ReconUNet
# trains on): K in {1,2,3,4}, coherent multipath replicas, mild array errors,
# SNR [-10,10] dB, narrowband ULA N=8, T=512, tau=8.  Smaller sizes so a
# SubspaceNet demonstration trains in minutes rather than the full 2M / hours.
# Writes to its own data/scenes/subnet_genk/ paths (clobbers nothing).

manifest:
  train_path: data/scenes/subnet_genk/train.npy
  val_path:   data/scenes/subnet_genk/val.npy
  test_path:  data/scenes/subnet_genk/test.npy
  train_size: 50_000
  val_size:    5_000
  test_size:  12_000

meta:
  M: 8
  element_spacing_lambda: 0.5
  array_type: ULA
  T: 512
  fs_Hz: 2.45e9
  speed_of_light: 2.998e8
  tau: 8
  K_max: 8
  angle_range_deg: [-60.0, 60.0]
  snr_range_db:    [-10.0, 10.0]
  version: "0.1-subnet-genk"
  notes: "Generalised SubspaceNet corpus — variable K + multipath (paper_corpus distribution, smaller)."

sampling:
  array_errors: mild
  k_choices: [1, 2, 3, 4]
  min_separation_deg: 10.0
  enable_multipath: true
  max_paths: 7
  num_multipath_components: null
  multipath_distribution: uniform
  mp_max_delay_factor: 10.0
  modulation: NARROWBAND
  rng_seed: 20260420
