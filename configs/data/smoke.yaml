# --------------------------------------------------------------------------
# Smoke corpus — throwaway, for the SubspaceNet correctness smoke train only.
# --------------------------------------------------------------------------
# Writes to its OWN data/scenes/smoke/ paths so it never clobbers the full
# 2M corpora at data/scenes/{train,val,test}.npy or data/scenes/paper/.
# K=3 fixed (matches SubspaceNet's fixed M=3), mild errors, no multipath —
# the cleanest setup to confirm the training loop drives val-RMSPE down.

manifest:
  train_path: data/scenes/smoke/train.npy
  val_path:   data/scenes/smoke/val.npy
  test_path:  data/scenes/smoke/test.npy
  train_size: 3_000
  val_size:     500
  test_size:    500

meta:
  M: 8
  element_spacing_lambda: 0.5
  array_type: ULA
  T: 512
  fs_Hz: 2.45e9
  speed_of_light: 2.998e8
  tau: 8
  K_max: 8
  angle_range_deg: [-60.0, 60.0]
  snr_range_db:    [0.0, 20.0]
  version: "0.1-smoke"
  notes: "Throwaway smoke corpus — not paper-grade."

sampling:
  array_errors: mild
  k_choices: [3]
  min_separation_deg: 5.0
  rng_seed: 20260420
