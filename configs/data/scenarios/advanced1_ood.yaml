# --------------------------------------------------------------------------
# Paper §IV scenario "Advanced 1" — out-of-distribution OOD test.
# --------------------------------------------------------------------------
#
# Source spec: docs/paper.pdf  §IV "Scenario matrix (stress tests)" —
#     "Advanced 1: one direct source with six coherent replicas (OOD
#      relative to training where M ≤ 3)."
#
# This is the *out-of-distribution* stress: the training corpus capped
# coherent replicas at M ≤ 3, so M = 6 here probes generalisation beyond
# the trained envelope.  Expected behaviour (paper Fig. 10): low-to-mid
# SNR improves over raw classics, then a "regularization-induced floor"
# appears at high SNR.
#
#   reconunet-generate -c configs/data/scenarios/advanced1_ood.yaml --overwrite
#   reconunet-evaluate-scenarios -c configs/eval/scenarios/advanced1_ood.yaml
# --------------------------------------------------------------------------

mode: fixed_angles_snr_sweep

manifest:
  test_path: data/scenes/scenarios/advanced1_ood/test.npy

meta:
  M: 8
  element_spacing_lambda: 0.5
  array_type: ULA
  T: 512
  fs_Hz: 2.45e9
  speed_of_light: 2.998e8
  tau: 8
  K_max: 8
  angle_range_deg: [-60.0, 60.0]
  snr_range_db: [-20.0, 20.0]
  version: "scenario-advanced1-ood-1.0"
  notes: "Paper §IV scenario: Advanced 1 OOD (1 direct + 6 coherent replicas)."

scenario:
  n_angle_configs: 1000
  snr_levels_db: [-20, -15, -10, -5, 0, 5, 10, 15, 20]
  k: 1                                    # Advanced 1 = 1 direct source
  num_multipath_components: 6             # 6 coherent replicas (OOD: training had ≤3)
  enable_multipath: true
  min_separation_deg: 10.0
  array_errors: mild
  rng_seed: 20260424
