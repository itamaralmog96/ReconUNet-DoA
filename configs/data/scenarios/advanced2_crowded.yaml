# --------------------------------------------------------------------------
# Paper §IV scenario "Advanced 2" — crowded scene.
# --------------------------------------------------------------------------
#
# Source spec: docs/paper.pdf  §IV "Scenario matrix (stress tests)" —
#     "Advanced 2: four direct sources with three coherent replicas
#      spread across emitters."
#
# This stresses the network with the maximum trained source count and the
# maximum trained replica count simultaneously.  Paper Table II reports
# "Crowd (4+3)" RMSE at 0 dB; ReconUNet+ESPRIT achieves 6.89° vs 12.03°
# for raw ESPRIT.
#
#   reconunet-generate -c configs/data/scenarios/advanced2_crowded.yaml --overwrite
#   reconunet-evaluate-scenarios -c configs/eval/scenarios/advanced2_crowded.yaml
# --------------------------------------------------------------------------

mode: fixed_angles_snr_sweep

manifest:
  test_path: data/scenes/scenarios/advanced2_crowded/test.npy

meta:
  M: 8
  element_spacing_lambda: 0.5
  array_type: ULA
  T: 512
  fs_Hz: 2.45e9
  speed_of_light: 2.998e8
  tau: 8
  K_max: 8
  angle_range_deg: [-60.0, 60.0]
  snr_range_db: [-20.0, 20.0]
  version: "scenario-advanced2-crowded-1.0"
  notes: "Paper §IV scenario: Advanced 2 Crowded (4 direct + 3 coherent replicas)."

scenario:
  n_angle_configs: 1000
  snr_levels_db: [-20, -15, -10, -5, 0, 5, 10, 15, 20]
  k: 4                                    # Advanced 2 = 4 direct sources
  num_multipath_components: 3             # 3 coherent replicas
  enable_multipath: true
  min_separation_deg: 10.0
  array_errors: mild
  rng_seed: 20260425
